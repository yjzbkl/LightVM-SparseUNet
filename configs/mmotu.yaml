experiment:
  name: lightvm_sparseunet_mmotu
  seed: 42
  output_dir: outputs/mmotu

dataset:
  name: MMOTU
  root: ""
  image_dir: images
  mask_dir: masks
  train_split_file: splits/mmotu_train.txt
  val_split_file: splits/mmotu_val.txt
  test_split_file: splits/mmotu_test.txt
  train_size: 800
  val_size: 200
  test_size: 469
  input_size: [224, 224]
  image_interpolation: bilinear
  mask_interpolation: nearest

augmentation:
  random_resized_crop:
    enabled: true
    scale: [0.75, 1.0]
    ratio: [0.9, 1.1]
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  gaussian_noise:
    enabled: true
    std: 0.03
    p: 0.25
  horizontal_flip:
    enabled: true
    p: 0.5
  vertical_flip:
    enabled: true
    p: 0.5
  random_rotation:
    enabled: true
    degrees: 20
  cutout:
    enabled: true
    p: 0.25
    size: 32

model:
  name: LightVMSparseUNet
  in_channels: 3
  num_classes: 1
  channels: [16, 32, 64, 128, 256, 512]
  mvm_num_branches: 8
  mvm_d_state: 5
  mvm_d_conv: 3
  mvm_expand: 0.3125
  mvm_dt_rank: 1
  mvm_projection_group_size: 8
  mvm_backend: selective_scan
  sssa_enabled: true
  sssa_sparse_rate: 32
  sssa_attention_dim: 1
  sssa_num_heads: 1

loss:
  name: bce_dice_logits
  bce_weight: 1.0
  dice_weight: 1.0

training:
  epochs: 1500
  batch_size: 32
  num_workers: 4
  optimizer: Adam
  learning_rate: 0.01
  weight_decay: 1.0e-5
  scheduler: CosineAnnealingLR
  scheduler_params:
    T_max: 1500
    eta_min: 1.0e-6
  amp: false
  threshold: 0.5
  save_interval: 50
  val_interval: 1
